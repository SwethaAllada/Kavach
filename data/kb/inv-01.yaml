id: INV-01
category: investment_stock
title: Guaranteed-return / VIP tips trading group
indicators:
- guaranteed returns
- guaranteed profit
- guaranteed 40%
- guaranteed 50%
- vip signal
- vip trading group
- double your money
- doubling of your money
- stock tip
- telegram group
- whatsapp group
- गारंटीड रिटर्न
- గ్యారంటీ లాభాలు
- గ్యారంటీ రిటర్న్
- ట్రేడింగ్ గ్రూప్
- డబ్బు రెట్టింపు
why_scam: SEBI does not permit anyone to guarantee returns. VIP groups on Telegram/WhatsApp
  with 'guaranteed profit' are pump-and-dump or outright ponzi schemes.
safe_action: Ignore. Only invest through SEBI-registered brokers. Verify advisor at
  sebi.gov.in/intermediaries.
source: SEBI investor caution on unregistered advisors
languages:
- en
- hi
- te
