language: en

# User-facing verdict strings. Keys are stable identifiers consumed by the
# engine/fusion layer; values are the strings shown to the user.
verdicts:
  scam: "This message shows strong signs of a scam. Do not click any links, share OTPs, or make any payment."
  likely_scam: "This message looks suspicious and matches common scam patterns. Proceed with caution and verify independently before acting."
  unclear: "We could not confidently classify this message. Avoid sharing personal details or OTPs until you verify the sender."
  likely_legit: "This message does not show strong scam indicators, but always verify sender identity for anything involving money or personal data."
  legit: "This message does not show signs of a scam based on our checks."

  no_action: "No immediate action needed."
  click_link_warning: "Do not click the link in this message."
  call_back_warning: "Do not call back the number in this message. Verify through official channels instead."
  share_credential_warning: "Never share OTPs, passwords, or PINs with anyone, including people claiming to be bank or government officials."
  make_payment_warning: "Do not make any payment based on this message."
  install_app_warning: "Do not install any app linked in this message."

  report_prompt: "You can report this message to cybercrime.gov.in or call 1930."
  verify_prompt: "Verify independently using the official app or website, not any number or link from this message."
  low_confidence_prompt: "If unsure, do not respond and consult someone you trust before acting."

  digital_arrest_note: "No Indian law enforcement agency arrests anyone over a video call or demands money for 'verification'."
  kyc_note: "Banks and telecom operators never ask you to update KYC by clicking a link sent over SMS or WhatsApp."

# Per-scam_type explanation + recommended_action used by classifier.py's
# rules-only fallback path (when the LLM is unavailable). Ported verbatim
# from the previous hardcoded _TEMPLATES dict in classifier.py.
fallback_templates:
  digital_arrest:
    explanation: "Signals of a 'digital arrest' scam: fake authority (police/CBI/ED), fear tactics, and payment demand. Real agencies never arrest over video calls."
    recommended_action: "Do not pay. Do not stay on the call. Report to 1930 and cybercrime.gov.in."
  kyc_bank:
    explanation: "Signals of a KYC/bank scam: urgent account-block warning and a request to verify or share credentials."
    recommended_action: "Do not click links. Do not share OTP/PIN. Call your bank on the number printed on your card."
  courier_parcel:
    explanation: "Signals of a fake courier/customs scam: 'parcel held' and demand for a fee or personal details."
    recommended_action: "Do not pay. Verify the parcel directly with the courier's official website or app."
  investment_stock:
    explanation: "Signals of an investment scam: guaranteed returns, VIP tips, or WhatsApp/Telegram trading groups."
    recommended_action: "Guaranteed returns do not exist. Do not send money or join paid groups. Report to 1930."
  lottery_prize:
    explanation: "Signals of a lottery/prize scam: 'you have won' with a processing-fee or bank-details request."
    recommended_action: "Do not pay any fee. Do not share bank details. It is a scam."
  upi_collect_request:
    explanation: "UPI collect / refund request: scammers get you to APPROVE a payment while promising a refund."
    recommended_action: "You never scan a QR or approve a request to RECEIVE money. Decline the request."
  job_task:
    explanation: "Signals of a task/work-from-home scam: promised earnings for likes/ratings, then a 'prepaid task'."
    recommended_action: "Do not pay any prepaid task fee. Legitimate jobs never ask you to pay to earn."
  loan_app:
    explanation: "Signals of a loan-app scam: instant loan, no documents, upfront processing fee."
    recommended_action: "Do not pay any advance fee. Use only RBI-registered lenders."
  tech_support:
    explanation: "Signals of a tech-support scam: 'your computer is infected' with a request to install remote-access software."
    recommended_action: "Do not install AnyDesk / TeamViewer for callers. Microsoft never calls you unsolicited."
  romance:
    explanation: "Signals of a romance scam: online partner asking for money, gifts, or airport/customs help."
    recommended_action: "Do not send money to someone you have not met. Report to 1930."
  deepfake_voice:
    explanation: "Signals of a deepfake-voice scam: urgent voice message from a 'family member' asking for money."
    recommended_action: "Call the person back on their known number before sending anything."
  other:
    explanation: "This message shows some suspicious signals. Treat it with caution."
    recommended_action: "Do not share OTPs, do not click links, verify with the official channel."
  likely_safe:
    explanation: "No clear scam signals detected. This message looks likely safe, but stay alert."
    recommended_action: "If in doubt, verify with the sender through a known contact channel."

# Guided-reporting text used by report.py's build_report(). Ported verbatim
# from _SUMMARIES / _TYPE_HUMAN / _ASK_CLAUSE.
report:
  summary_parts:
    opener: "On [DATE], I received a message/call claiming to be from {entity}."
    asked: "It asked me to {ask}."
    belief: "I believe this is a {scam_type_human} scam."
    payment: "I transferred / was asked to transfer money [AMOUNT] via [UPI/BANK REF]."
    contact_prefix: "Sender / contact details from the message:"
    no_contact: "No sender contact details were visible in the message."
    personal: "My details: [YOUR NAME], [YOUR PHONE], [YOUR CITY]."
  type_human:
    digital_arrest: "digital arrest"
    kyc_bank: "KYC / bank verification"
    courier_parcel: "fake courier / customs"
    investment_stock: "investment / stock tip"
