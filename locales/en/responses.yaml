    kyc_bank: "share OTP / click a link to complete KYC"
    courier_parcel: "pay a customs / clearance fee to release a parcel"
    investment_stock: "join a trading group / deposit money for guaranteed returns"
    lottery_prize: "pay a 'processing fee' or share bank details to claim a prize"
